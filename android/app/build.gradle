plugins {
    id 'com.android.application'
}

android {
    namespace 'com.generalsx.zerohour'
    compileSdk 35

    // A fixed, committed debug keystore (android/app/debug.keystore) — NOT the
    // machine-local ~/.android/debug.keystore that Android tooling
    // auto-generates with a random key on first use. That default is fine on
    // a dev workstation but fatal on CI: a fresh GitHub Actions runner has no
    // ~/.android/debug.keystore, generates a NEW random key every run, and
    // every build then has a different signature — Android refuses to
    // install an update over the previous APK ("signatures don't match",
    // requires an uninstall first). Signing every build with the same
    // in-repo key makes CI builds installable as updates over each other.
    // This is a debug-only key with a well-known password; never use it to
    // sign anything meant for a store listing.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.generalsx.zerohour'
        testInstrumentationRunner 'com.generalsx.zerohour.GameDataSetupSmoke'
        // API 28 (Android 9): floor that still covers the Redmi Note 8 Pro
        // line while giving bionic glob(3) and stable Vulkan loader behavior.
        // The real graphics gate is the GPU driver, not the OS version — see
        // docs/port/ANDROID_PORT.md (DXVK 2.6 needs Vulkan 1.3).
        //
        // GeneralsX @build Android port launcher-ui-2026 08/09/2026 Audited for
        // a drop to 24 (Android 7.0) while modernising the launcher UI, and
        // deliberately NOT lowered. The launcher's own Java is clean at 24 —
        // `gradle :app:lintDebug` with minSdk 24 reports zero NewApi findings
        // anywhere under java/com/generalsx/zerohour/ (the one API-30 call,
        // Environment.isExternalStorageManager() in onSelectGameFolder(), is
        // already behind a SDK_INT >= R gate, and FeatureInfo.version /
        // Comparator.comparing() are both exactly API 24). Two things outside
        // this file block it:
        //
        //   1. The native side is built against android-28 — see
        //      CMakePresets.json's android-vulkan preset (ANDROID_PLATFORM
        //      "android-28") and cmake/triplets/arm64-android.cmake, which pins
        //      every vcpkg dependency to the same level. An APK declaring 24
        //      would install on Android 7/8 and then fail to dlopen its own
        //      libraries. Changing that is a native/CMake decision, not a
        //      launcher one.
        //   2. SDL's own staged Java (src/main/java-sdl, regenerated by
        //      scripts/build/android/package-android-zh.sh) calls
        //      InputDevice#isExternal (API 29) unguarded in
        //      SDLControllerManager.java — a fatal NewApi lint error at
        //      minSdk 24, in a file this repo does not own.
        //
        // The launcher UI is written to the API 24 surface regardless, so if
        // both of the above are ever resolved, this line is the only change
        // needed here.
        minSdk 28
        targetSdk 35
        // GeneralsX @feature Android port 08/07/2026 Version numbers are
        // manually managed from here on -- CI no longer auto-bumps versionCode
        // from the workflow run number on every push. Bump these two values
        // by hand when you actually want to ship a new version; -PandroidVersionCode=N
        // / -PandroidVersionName=X.Y.Z (wired from the "Build Android" workflow's
        // manual-dispatch inputs) can still override them for one-off CI builds
        // without touching this file. versionCode must strictly increase for
        // Android to accept installing one APK "over" another via a normal tap
        // install (adb install -r doesn't care) -- keep it above whatever is
        // already on your device.
        // Scheme: versionCode = major*10000 + minor*100 + patch, so the
        // number always sorts the same way as versionName (1.2.0 -> 10200).
        // GeneralsX @build Quest XR 15/09/2026 P20/P21 is the first merged
        // tabletop presentation checkpoint after the 1.2.7 device candidate.
        // GeneralsX @build Codex 16/09/2026 The endgame fix follows the
        // private 10215 release and the 10216 headset-only diagnostic APK.
        versionCode (project.hasProperty('androidVersionCode') ? (project.androidVersionCode as Integer) : 10224)
        versionName (project.hasProperty('androidVersionName') ? project.androidVersionName : '1.2.24-xr-preview')
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // GeneralsX @spike XR port Phase 0.5 - two launcher entries need two
    // packages: Quest shows one icon per app, so the VR activity can never
    // get its own icon inside the 2D package (verified on device). The xr
    // flavor strips the 2D activities via src/xr/AndroidManifest.xml
    // (tools:node="remove") and vice versa, leaving exactly one launcher
    // activity per APK. Same namespace (JNI names unchanged), same native
    // lib, different applicationId.
    flavorDimensions "app"
    productFlavors {
        zh {
            dimension "app"
        }
        xr {
            dimension "app"
            applicationId "com.generalsx.zerohour.xr"
        }
    }

    sourceSets {
        main {
            // Both directories are STAGED by scripts/build/android/package-android-zh.sh
            // (gitignored): jniLibs/ receives the CMake-built .so set, java-sdl/
            // receives org/libsdl/app/*.java from the in-tree SDL3 source so the
            // shell always matches the exact SDL version the game linked.
            java.srcDirs += 'src/main/java-sdl'
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Small runtime files bundled into the APK, staged by the packaging
            // script: assets/gamedata/ (fonts/, dxvk.conf, DefaultOptions.ini)
            // is extracted to the external files dir on first launch;
            // assets/default_driver/ (fallback Turnip build, see
            // SetupActivity.applyRecommendedDriverIfNeeded()) is extracted to
            // app-private internal storage only on Adreno phones that need it.
            assets.srcDirs = ['src/main/assets']
        }
    }

    buildTypes {
        debug {
            // Explicit: overrides AGP's implicit per-machine debug signingConfig
            // with the fixed in-repo key above.
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            // GeneralsX @build Codex 16/09/2026 Release APKs are never signed
            // with the committed development key. The XR packaging script
            // signs the unsigned artifact with a private key and a rotation
            // lineage that preserves installed data from earlier previews.
            debuggable false
        }
    }

    packagingOptions {
        jniLibs {
            // GeneralsX @bugfix Android port 10/07/2026 libadrenotools (custom
            // Vulkan driver loading, cmake/adrenotools.cmake) hard-requires
            // uncompressed, on-disk native libraries: it installs its hook by
            // dlopen()ing .so files it expects to find at
            // ApplicationInfo.nativeLibraryDir, which is only populated with
            // real files when legacy packaging is on -- with it off, Android
            // reads .so's straight out of the APK and nativeLibraryDir isn't
            // a real, browsable directory. Costs a bit of APK size (no .so
            // compression) in exchange for that directory existing.
            useLegacyPackaging true

            // GeneralsX @bugfix Android port 18/07/2026 Do NOT let AGP's
            // stripReleaseDebugSymbols strip the DXVK libraries. Stripped
            // libdxvk_d3d8/d3d9.so crash mid-render with corrupted Vulkan
            // dispatch (SIGSEGV / stray dxvk::DxvkError escaping into the
            // engine's update loop as an "unrecognized exception" -> the
            // "Technical Difficulties" box the moment the 3D shell map scene
            // flushes its first frames). Root-caused and fix verified by the
            // sibling GeneralsX Android fork (tarek369/GeneralsZH-Android,
            // commit 23f73d1) on the same OnePlus Pad 2 hardware one of our
            // issue #2 reporters uses: backtrace lands in the DX8 draw path
            // (DX8Wrapper::Draw -> SortingRendererClass::Flush_Sorting_Pool ->
            // RTS3DScene::Flush -> libdxvk_d3d9.so, fault addr 0x2000000001)
            // only when the libs are stripped; keeping symbols fixes it.
            keepDebugSymbols += ['**/libdxvk_d3d8.so', '**/libdxvk_d3d9.so']
        }
    }
}

dependencies {
    // Material Components for the Setup/Settings/Log-viewer screens only —
    // GeneralsZHActivity (the actual game surface) stays on its own plain
    // fullscreen theme and never touches these widgets.
    implementation 'com.google.android.material:material:1.12.0'

    // GeneralsX @bugfix Android port 11/07/2026 explicit dependency for
    // WindowInsetsCompat (InsetUtil.java) -- pulled in transitively by
    // Material already, but declared directly since we call its APIs.
    implementation 'androidx.core:core:1.13.1'
}
